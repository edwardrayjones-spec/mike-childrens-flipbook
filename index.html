<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10233f"><title>Hi, My Name Is Mike, and I Love to Lie! — Flipbook</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#30466f 0%,#14243f 45%,#081326 100%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column;align-items:center}header{text-align:center;padding:24px 16px 6px}h1{font-size:clamp(20px,3vw,32px);margin:0 0 5px}header p{margin:0;color:#becbe0;font-size:14px}main{width:min(96vw,1500px);flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:18px 0}.book{width:100%;perspective:1800px;position:relative;filter:drop-shadow(0 18px 28px #0009)}.sheet{position:relative;width:100%;aspect-ratio:3/1;background:#fff;border-radius:8px;overflow:hidden;transform-style:preserve-3d;box-shadow:inset 0 0 0 1px #fff6;isolation:isolate}.sheet:before{content:"";position:absolute;left:50%;height:100%;width:8px;z-index:4;transform:translateX(-50%);background:linear-gradient(90deg,#2a223e33,#ffffff77,#14192d33);pointer-events:none}.sheet img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}.turn{animation:turn .5s cubic-bezier(.3,.1,.2,1)}.turnBack{animation:turnback .5s cubic-bezier(.3,.1,.2,1)}@keyframes turn{0%{transform:rotateY(0);opacity:1}48%{transform:rotateY(-28deg) scale(.97);opacity:.72}100%{transform:rotateY(0);opacity:1}}@keyframes turnback{0%{transform:rotateY(0);opacity:1}48%{transform:rotateY(28deg) scale(.97);opacity:.72}100%{transform:rotateY(0);opacity:1}}nav{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px auto 0;padding-bottom:26px}button{cursor:pointer;border:1px solid #ffffff55;background:#fff;color:#16243e;font-size:17px;font-weight:650;border-radius:12px;min-height:45px;padding:10px 20px;box-shadow:0 4px 14px #0003}button:hover{background:#f6e7c5}button:disabled{opacity:.35;cursor:default}#counter{min-width:92px;text-align:center;color:#d6e2f5;font-variant-numeric:tabular-nums}footer{color:#b0bfda;font-size:12px;padding:0 16px 22px;text-align:center}#progress{height:3px;background:#ffffff25;width:100%;position:absolute;bottom:0;left:0}#bar{height:100%;width:0;background:#f2c66a;transition:width .4s}.tip{font-size:12px;color:#ced8ea;margin-top:7px}@media (max-width:680px){header{padding-top:16px}main{width:100vw;padding:8px 2px} .sheet{border-radius:3px}nav{gap:8px;padding-bottom:13px}button{font-size:14px;padding:8px 12px;min-height:40px} .sheet:before{width:3px}}@media(orientation:portrait) and (max-width:680px){main{flex:0 0 auto;margin-top:15vh}.tip:after{content:" · Turn your phone sideways for larger pages"}} 
</style></head>
<body><header><h1>Hi, My Name Is Mike, and I Love to Lie!</h1><p>An illustrated poem by Edward R Jones</p></header>
<main><div class="book" id="book" aria-label="Interactive picture book"><div class="sheet" id="sheet"><img id="art" src="pages/00.svg" alt="Book cover" draggable="false"><div id="progress"><div id="bar"></div></div></div></div></main>
<nav><button id="prev" aria-label="Previous pages">❮ Previous</button><span id="counter" aria-live="polite">Cover</span><button id="next" aria-label="Next pages">Next ❯</button><button id="full" aria-label="Full screen">⛶</button></nav>
<div class="tip">Use the arrows, left/right keyboard keys, or swipe to turn pages</div><footer>© Edward R Jones · Illustrated reading edition</footer>
<script>
const total=14;let index=0,busy=false;
const art=document.getElementById('art'),sheet=document.getElementById('sheet'),counter=document.getElementById('counter'),bar=document.getElementById('bar'),prev=document.getElementById('prev'),next=document.getElementById('next');
function update(){art.src='pages/'+String(index).padStart(2,'0')+'.svg';art.alt=index===0?'Cover':index===total-1?'Closing page':'Illustrated story spread '+index;counter.textContent=index===0?'Cover':(index+1)+' / '+total;bar.style.width=(index/(total-1)*100)+'%';prev.disabled=index===0;next.disabled=index===total-1}
function move(delta){if(busy||index+delta<0||index+delta>=total)return;busy=true;index+=delta;update();sheet.classList.remove('turn','turnBack');void sheet.offsetWidth;sheet.classList.add(delta>0?'turn':'turnBack');setTimeout(()=>{sheet.classList.remove('turn','turnBack');busy=false},510)}
prev.onclick=()=>move(-1);next.onclick=()=>move(1);
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();move(1)}if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}});
let startX=0;sheet.addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX},{passive:true});sheet.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-startX;if(Math.abs(dx)>40)move(dx<0?1:-1)},{passive:true});
document.getElementById('full').onclick=()=>{if(!document.fullscreenElement){document.getElementById('book').requestFullscreen?.()}else{document.exitFullscreen?.()}};
for(let i=1;i<total;i++){const pre=new Image();pre.src='pages/'+String(i).padStart(2,'0')+'.svg';}update();
</script></body></html>
